name: Atualizar feed ANEEL

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas
  workflow_dispatch:         # permite rodar manualmente

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar feed
        run: python gerar_feed.py
      - name: Publicar alterações
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml cache.json
          git diff --cached --quiet || git commit -m "Atualiza feed"
          git push
